apps:
- name: LMSBuddy
  app_id: 634b4ff8-16ca-4856-8a0e-7d31694a6418
  api_key: lpuai_72Ifgh9-dHTzkfwbS5HtPfS4gElKUZ0vR2i1b5KJ18Q
  allowed_workflows:
  - student_grade_inquiry
  - enrollment
  - policy_lookup
  - resource_request
  - data_mutation
  - general
  allowed_tools:
  - detect_workflow
  - get_context
  - get_student
  - build_context
  - update_student
  rate_limit_rpm: 120
  token_quota_monthly: 1000000
  cache_ttl_seconds: 3600
  app_config:
    theme: dark
    primary_color: '#6366F1'
    secondary_color: '#8B5CF6'
    accent_color: '#22D3EE'
    font_family: Inter
    icon: chat-bubble
    border_radius: 12px
    header_title: LPU Online
    header_badge: Buddy
    search_label: Ask LPU Buddy
    search_hint: "Enter to send \xC2\xB7 Esc to cancel"
    empty_recents: No recent chats yet. Start a conversation below.
    empty_sidebar: No chats yet
    fun_text: We've been trained to help you with student questions 24 x 7.
    placeholders:
    - Ask about your courses, fees, or exams
    - Need help with results or attendance?
    - Tell me what you want to check today
    - Let us solve it together
    - What would you like to understand next?
    - Ask LPU Buddy anything about your student journey
    quick_actions:
    - iconKey: courses
      title: My Courses
      prompt: Give me a quick overview of my current courses and what I should focus
        on this week.
    - iconKey: attendance
      title: Attendance
      prompt: Help me understand how to check my attendance and stay above the minimum
        requirement.
    - iconKey: exams
      title: Exams
      prompt: What should I review first if I want to prepare for my upcoming exams?
    - iconKey: results
      title: Results
      prompt: Explain how I can review my latest results and what they mean for my
        progress.
    - iconKey: fees
      title: Fee Status
      prompt: Show me what I should check when reviewing my university fee status.
    - iconKey: campus
      title: Campus
      prompt: Tell me what student services and campus resources I should know about
        right now.
    data_resolvers:
    - resolver: student_profile
      key: student
      requires_actor: true
  metadata:
    owner: Platform Team
    description: Primary student-facing interface for academic queries
